apiVersion: 1

datasources:
  - name: Pipeline ops (Postgres)
    uid: ops-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: db:5432
    user: grafana_ro                       # SELECT on ops views only
    database: ${PG_DB}
    isDefault: true
    editable: false
    jsonData:
      sslmode: disable                     # container-to-container on the compose network
      postgresVersion: 1600
      maxOpenConns: 5
    secureJsonData:
      password: ${GRAFANA_RO_PASSWORD}
